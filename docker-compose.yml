services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sticker
      POSTGRES_PASSWORD: sticker
      POSTGRES_DB: sticker_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sticker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: sticker
      DATABASE_PASSWORD: sticker
      DATABASE_NAME: sticker_development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
