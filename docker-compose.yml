services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sticker
      POSTGRES_PASSWORD: sticker
      POSTGRES_DB: sticker_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sticker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single image: Rails serves the bundled web app and the API on one origin.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: sticker
      DATABASE_PASSWORD: sticker
      DATABASE_NAME: sticker_development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
