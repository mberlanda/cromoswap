<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Import restore reference</title>
  <desc id="desc">Import panel showing text merge and JSON restore choices.</desc>
  <rect width="960" height="540" fill="#f7faf8"/>
  <rect x="112" y="80" width="736" height="380" rx="8" fill="#ffffff" stroke="#d8e1dd" stroke-width="3"/>
  <text x="152" y="134" fill="#17211f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="900">Import a list or backup</text>
  <text x="152" y="174" fill="#60706b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Restore JSON as a new session, or merge text codes into the current one.</text>
  <rect x="152" y="224" width="298" height="142" rx="8" fill="#eaf2ff" stroke="#2f74d0" stroke-width="3"/>
  <text x="184" y="270" fill="#184f94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="900">JSON restore</text>
  <text x="184" y="306" fill="#184f94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">New session</text>
  <text x="184" y="334" fill="#184f94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Scans + images + album</text>
  <rect x="510" y="224" width="298" height="142" rx="8" fill="#fff2cc" stroke="#f2b84b" stroke-width="3"/>
  <text x="542" y="270" fill="#735000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="900">Text merge</text>
  <text x="542" y="306" fill="#735000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Owned, missing, or duplicate</text>
  <text x="542" y="334" fill="#735000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Non-destructive import</text>
  <rect x="152" y="396" width="656" height="44" rx="22" fill="#1f8a5f"/>
  <text x="480" y="425" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="900">Choose .txt or .json</text>
</svg>
